<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초등학교 방과후 수업 신청 시스템</title>
  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 둥글둥글 귀여운 초등학교 느낌의 웹폰트 (Jua & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ff8a3d;
      --primary-hover: #f27420;
      --primary-light: #fff3e6;
      --secondary: #4ea8de;
      --secondary-light: #e8f5fd;
      --bg: #fffdf7;
      --card: #ffffff;
      --text: #374151;
      --text-muted: #6b7280;
      --border: #f3e5d0;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --regular-bg: #f8fafc;
      --radius: 20px;
      --shadow: 0 6px 18px rgba(255, 138, 61, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#fde68a 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 56px;
    }

    header {
      background: linear-gradient(135deg, #ffb703 0%, #ff8a3d 100%);
      color: #ffffff;
      padding: 24px 16px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 4px 14px rgba(255, 138, 61, 0.25);
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header h1 {
      font-family: "Jua", sans-serif;
      font-size: 1.7rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 4px rgba(180, 83, 9, 0.2);
    }

    header p {
      font-size: 0.92rem;
      font-weight: 500;
      opacity: 0.95;
      margin-top: 2px;
    }

    .container {
      max-width: 1120px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    @media (min-width: 960px) {
      .top-grid {
        display: grid;
        grid-template-columns: 390px 1fr;
        gap: 22px;
        align-items: start;
      }
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-family: "Jua", sans-serif;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #1f2937;
    }

    .period-banner {
      background: #fef3c7;
      border: 2px dashed #f59e0b;
      color: #92400e;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: #4
